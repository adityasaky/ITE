signer:
  - "kms:key1"
  - "kms:key2"
keys:
  - "kms:engineering/alice"
  - "kms:engineering/bob"
  - "kms:automation/builder1"
  - "kms:automation/builder2"
  - "kms:qa/carol"
steps:
  - name: checkout
    command: git clone URL foo
    predicates:
      - link
    expectedProducts:
      - CREATE foo/* # recorded with gitCommit for the repository as a whole
    pubkeys: [alice]
  - name: code-review
    predicates: # does this list indicate or?
      - vcs-review
      - human-review
    expectedMaterials:
      - artifact: MATCH foo/* WITH products FROM checkout # code review should be for the same gitCommit as before
    expectedAttributes:
      - policyDSL: assert result == true # this is just to sketch out an idea
    pubkeys: [alice, bob]
  - name: test
    command: make test
    predicates:
      - test-run
    expectedMaterials:
      - artifact: MATCH foo/* WITH products FROM checkout
    expectedAttributes:
      - policyDSL: assert len(failedTests) == 0 # we're okay with tests with warnings in this case, which is why we're not using predicate.Result
    pubkeys: [builder1, builder2]
  - name: build
    command: make
    substeps:
      - predicates:
          - slsa-provenance
        expectedMaterials:
          - artifact: MATCH foo/* WITH products FROM checkout
        expectedProducts:
          - artifact: CREATE bin/foo
        expectedAttributes:
          - policyDSL: assert invocation.configSource.digest == attestations[checkout][predicateType==link].products["Makefile"].digest
      - predicates:
          - runtime-trace
        expectedMaterials:
          - artifact: MATCH foo/* WITH products FROM checkout
        expectedOutcomes:
          - artifact: CREATE bin/foo
          - policyDSL: assert predicate.monitor.tracePolicy.network == true
          - policyDSL: assert len(predicate.monitorLog.network) == 0
    pubkeys: [builder1, builder2]
    threshold: 2 # reproducible builds
  - name: record-attributes
    command: make scai-report
    predicates:
      - scai
    expectedMaterials:
      - artifact: MATCH bin/foo WITH products FROM build
    expectedOutcomes:
      - policyDSL: assert predicate.attributes[attribute==WITH_STACK_PROTECTION].conditions.flags == "-fstack-protector"
    pubkeys: [builder1, builder2]
  - name: package
    command: make package
    predicates:
      - link
    expectedMaterials:
      - artifact: MATCH bin/foo WITH products FROM build # here, we know build is slsa-provenance and to use its subject
    expectedOutcomes:
      - artifact: CREATE dist/foo.tar.gz
    pubkeys: [builder1, builder2]
  - name: generate-sbom
    command: make sbom
    predicates:
      - spdx
      - cyclonedx
    pubkeys: [builder1, builder2]
  - name: quality-assurance
    predicates:
      - layout # sublayout declaration
    expectedMaterials:
      - artifact: MATCH * WITH products IN dist FROM package
    expectedOutcomes:
      - policyDSL: assert attestations[quality-assurance][predicateType==qa-review] # assert the bundle returned for this sublayout contains an entry with the required predicateType
      - policyDSL: assert attestations[quality-assurance][predicateType==legal-review]
    pubkeys: [carol]
inspections:
  - name: inspect-binary
    command: tar xf foo.tar.gz
    expectedMaterials:
      - artifact: MATCH foo.tar.gz WITH products IN dist FROM package
    expectedOutcomes:
      - artifact: MATCH foo WITH products IN bin FROM build
  - name: inspect-foo
    subject: foo/*
    policies:
      - policyDSL: assert that a test was run and was positive
      - policyDSL: assert that it was reviewed