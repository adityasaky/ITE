signer:
  - "kms:key1"
  - "kms:key2"
keys:
  - "kms:alice"
  - "kms:bob"
  - "kms:builder1"
  - "kms:builder2"
steps:
  - name: checkout
    command: git clone URL foo
    predicates:
      - link
    expectedProducts:
      - CREATE foo/* # we could record the git aspects as well, the artifact rules may be unaffected (ITE-4 ish)
    pubkeys: [alice]
  - name: code-review
    predicates: # does this list indicate or?
      - vcs-review
      - human-review
    expectedMaterials:
      - MATCH foo/* WITH products FROM checkout
    expectedProducts:
      - assert predicate.result is true # this is just to sketch out an idea
    pubkeys: [alice, bob]
  - name: test
    command: make test
    predicates:
      - test-run
    expectedMaterials:
      - MATCH foo/* WITH products FROM checkout
    expectedProducts: # in this case, the product of the test step is the result of the step
      - assert len(predicate.testRun.failedTests) is 0 # we're okay with tests with warnings in this case, which is why we're not using predicate.Result
    pubkeys: [builder1, builder2]
  - name: build
    command: make
    predicates:
      - slsa-provenance
    expectedMaterials:
      - MATCH foo/* WITH products FROM checkout
    expectedProducts:
      - CREATE bin/foo
    otherPolicy: # not fun, "materials", "products", "other" is confusing
      - assert predicate.invocation.configSource.digest is steps[checkout].products["Makefile"].digest # is this really a product though? not really!
    pubkeys: [builder1, builder2]
    threshold: 2 # reproducible builds
  - name: package
    command: make package
    predicates:
      - link
    expectedMaterials:
      - MATCH bin/foo WITH products FROM build # here, we know build is slsa-provenance and to use its subject
    expectedProducts:
      - CREATE dist/foo.tar.gz
    pubkeys: [builder1, builder2]
inspections:
  - name: inspect-binary
    command: tar xf foo.tar.gz
    expectedMaterials:
      - MATCH foo.tar.gz WITH products IN dist FROM package
    expectedProducts:
      - MATCH foo WITH products IN bin FROM build